[package]
name = "axiora-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "axiora"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
axiora-package = { path = "../axiora-package" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
