<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · Axiora</title>
  <link rel="stylesheet" href="assets/study.css">
  <script src="assets/library.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img class="mark" src="assets/logos/axiom.svg" alt="">
      <span class="wordmark">Axiora</span>
      <small class="prototype">UI prototype</small>
    </header>
    <main class="content">
      <div class="intro">
        <div class="heading-actions">
          <h1>Library</h1>
          <a class="button button--quiet" href="import.html">Import course</a>
        </div>
        <p>Browse installed courses. This preview uses sample records.</p>
      </div>
      <div class="catalog-controls">
        <div>
          <label for="catalog-search">Search courses</label>
          <input id="catalog-search" type="search" placeholder="Title or subject">
        </div>
        <div>
          <label for="catalog-filter">Show</label>
          <select id="catalog-filter">
            <option value="all">All courses</option>
            <option value="ongoing">In progress</option>
            <option value="new">Ready to start</option>
          </select>
        </div>
      </div>
      <p class="meta catalog-count" id="catalog-count" role="status"></p>
      <ul class="catalog-list" id="catalog-list"></ul>
      <noscript><p>Enable JavaScript to browse the sample library.</p></noscript>
    </main>
    <nav class="navigation" aria-label="Main screens">
      <a href="index.html"><span class="nav-icon nav-icon--home" aria-hidden="true"></span>Home</a>
      <a href="library.html" aria-current="page"><span class="nav-icon nav-icon--library" aria-hidden="true"></span>Library</a>
      <a href="review.html"><span class="nav-icon nav-icon--review" aria-hidden="true"></span>Review</a>
    </nav>
  </div>
</body>
</html>
